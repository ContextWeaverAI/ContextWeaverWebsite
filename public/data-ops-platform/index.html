<style>
  :root{
    --page:#F4F4F0; --ink:#1A1A14; --orange:#C8491F; --orange-soft:#E8825C;
    --body:#514E48; --muted:#928E86; --card:#FCFBF8; --border:#DEDAD0;
    --green:#3E7C4F; --amber:#C88A1F; --wire:#C9C3B6;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,monospace;
    --panel:410px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#e9e8e2;color:var(--ink);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;}

  /* ---- fixed top bar ---- */
  .topbar{position:fixed;top:0;left:0;right:0;height:52px;z-index:90;
    display:flex;align-items:center;gap:16px;padding:0 20px;
    background:rgba(244,244,240,.86);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);}
  .brand{font-weight:700;letter-spacing:.2px;font-size:15px;}
  .brand .dot{color:var(--orange);}
  .legend{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--muted);}
  .legend b{color:var(--body);font-weight:600;}
  .hint{font-size:12px;color:var(--muted);border:1px dashed var(--border);
    border-radius:20px;padding:4px 12px;}

  /* ---- scroll stage ---- */
  .stage{position:relative;padding:52px 0 40px;}
  .canvas{position:relative;width:1560px;height:1450px;margin:20px auto;
    transform-origin:0 0;transition:transform .55s cubic-bezier(.22,.7,.28,1);}

  svg.wires{position:absolute;inset:0;width:1560px;height:1450px;overflow:visible;
    pointer-events:none;z-index:1;transition:opacity .4s;}
  svg.wires path.wire{fill:none;stroke:var(--wire);stroke-width:2;
    stroke-linecap:round;opacity:.9;}
  svg.wires path.xlink{fill:none;stroke:var(--orange-soft);stroke-width:1.4;
    stroke-dasharray:4 5;opacity:0;}

  .dom{position:absolute;inset:0;width:1560px;height:1450px;z-index:2;}

  /* pulse dots travelling along wires */
  .pulse{position:absolute;top:0;left:0;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;
    border-radius:50%;background:var(--orange);z-index:3;pointer-events:none;
    box-shadow:0 0 9px 2px rgba(200,73,31,.55);
    animation:flow linear infinite;}
  @keyframes flow{from{offset-distance:0%;opacity:0}
    8%{opacity:1} 92%{opacity:1} to{offset-distance:100%;opacity:0}}

  /* ---- focus / magnify ---- */
  .canvas.focusing svg.wires{opacity:.5;}
  .dom.focusing .node,.dom.focusing .step,.dom.focusing .databox{
    opacity:.26;filter:blur(.7px);transition:opacity .4s,filter .4s;}
  .dom.focusing .node.focused,.dom.focusing .databox.focused{
    opacity:1;filter:none;}
  .node.focused{box-shadow:0 0 0 2px var(--orange),0 22px 54px rgba(26,26,20,.22)!important;
    z-index:32!important;}
  .databox.focused{box-shadow:0 0 0 2px var(--orange),0 22px 54px rgba(26,26,20,.14)!important;}

  /* ---- numbered steps + hover tip ---- */
  .step{position:absolute;z-index:7;display:flex;align-items:center;gap:9px;cursor:default;}
  .num{width:23px;height:23px;flex:none;border-radius:50%;background:var(--ink);color:#fff;
    font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
    transition:background .18s;}
  .step:hover .num,.gatebar:hover .num,.dbhd:hover .num{background:var(--orange);}
  .lbl{font-size:12px;font-weight:700;letter-spacing:1.4px;color:var(--muted);
    text-transform:uppercase;}
  .tip{position:absolute;top:30px;left:0;width:236px;background:var(--ink);color:#F4F4F0;
    font-size:11.5px;font-weight:400;letter-spacing:0;text-transform:none;line-height:1.55;
    padding:10px 12px;border-radius:9px;opacity:0;transform:translateY(-4px);
    pointer-events:none;transition:.16s;box-shadow:0 10px 28px rgba(0,0,0,.28);z-index:30;}
  .step:hover .tip,.gatebar:hover .tip,.dbhd:hover .tip{opacity:1;transform:translateY(0);}
  /* while magnified, the panel carries the detail — hover tips would just compete */
  .dom.focusing .tip{opacity:0!important;}

  /* ---- data layer box (one container around all tables) ---- */
  .databox{position:absolute;left:360px;top:150px;width:1150px;height:440px;
    border:1.5px solid var(--border);border-radius:16px;
    background:rgba(252,251,248,.5);z-index:1;pointer-events:none;
    transition:box-shadow .3s,opacity .4s,filter .4s;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.5), 0 1px 12px rgba(26,26,20,.04);}
  .dbhd{position:absolute;top:12px;left:18px;display:flex;align-items:center;gap:9px;
    font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--muted);pointer-events:auto;cursor:pointer;}
  .dbhd small{font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);}

  /* ---- generic node card ---- */
  .node{position:absolute;background:var(--card);border:1px solid var(--border);
    border-radius:10px;box-shadow:0 2px 10px rgba(26,26,20,.06);z-index:2;
    transition:opacity .5s ease, transform .5s ease, box-shadow .3s, filter .4s;}
  .node.enter{opacity:0;transform:translateY(10px) scale(.96);}
  .node .hd{display:flex;align-items:center;gap:7px;padding:8px 11px;
    border-bottom:1px solid var(--border);font-size:12.5px;font-weight:700;}
  .node .hd .mono{font-family:var(--mono);color:var(--body);}
  .node .tag{margin-left:auto;font-size:10px;font-weight:600;color:var(--muted);
    background:#F0EEE7;border-radius:5px;padding:2px 6px;letter-spacing:.3px;}

  /* ---- connectors panel ---- */
  .connectors{left:60px;top:260px;width:212px;padding:6px;}
  .connectors .title{padding:6px 8px 8px;font-weight:700;font-size:13px;
    display:flex;align-items:center;gap:7px;}
  .conn{display:flex;align-items:center;gap:9px;padding:9px 8px;border-radius:8px;
    cursor:pointer;user-select:none;transition:background .15s;}
  .conn:hover{background:#F0EEE7;}
  .conn .sw{width:34px;height:19px;border-radius:20px;background:#D8D3C8;
    position:relative;transition:background .25s;flex:none;}
  .conn .sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;
    border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);
    transition:transform .25s;}
  .conn.on .sw{background:var(--orange);}
  .conn.on .sw::after{transform:translateX(15px);}
  .conn .nm{font-size:13px;font-weight:600;}
  .conn .src{font-size:10.5px;color:var(--muted);margin-left:auto;}
  .conn.on .nm{color:var(--ink);}
  .conn:not(.on) .nm{color:var(--muted);}

  /* ---- table card ---- */
  .tbl{width:220px;cursor:pointer;}
  .grid{padding:6px 8px 9px;}
  .grid .cols{display:flex;gap:5px;margin-bottom:5px;flex-wrap:wrap;}
  .chip{font-size:10.5px;font-family:var(--mono);color:var(--body);
    background:#F0EEE7;border-radius:5px;padding:2px 7px;white-space:nowrap;
    transition:opacity .5s, transform .5s;}
  .chip.ghost{opacity:0;transform:scale(.8);}
  .chip.newcol{background:#FBE7DE;color:var(--orange);}
  .grid table{width:100%;border-collapse:collapse;font-size:11px;}
  .grid td{padding:2.5px 4px;color:var(--body);border-top:1px solid #EFEDE6;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px;}
  .grid td.st-run{color:var(--green);font-weight:600;}
  .grid td.st-idle{color:var(--amber);font-weight:600;}

  /* ---- gate bars (governance + guard rails) ---- */
  .gatebar{left:360px;width:1150px;height:54px;display:flex;align-items:center;
    gap:14px;padding:0 16px;cursor:pointer;z-index:4;}
  .gatebar:hover{box-shadow:0 4px 16px rgba(26,26,20,.12);}
  .govbar{top:632px;}
  .railbar{top:716px;}
  .gatebar .glabel{font-weight:700;font-size:13px;white-space:nowrap;display:flex;
    align-items:center;gap:7px;}
  .gatebar .glabel small{font-weight:500;color:var(--muted);}
  .gatebar .roles{display:flex;gap:6px;}
  .rolechip{font-size:11px;font-weight:600;border:1px solid var(--border);
    border-radius:6px;padding:3px 9px;cursor:pointer;color:var(--body);background:#fff;
    transition:background .15s,border-color .15s,color .15s;}
  .rolechip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .railchip{font-size:11px;font-weight:600;border:1px solid #EBD9CF;
    border-radius:6px;padding:3px 9px;cursor:pointer;color:var(--orange);background:#FDF6F2;
    transition:background .15s;}
  .railchip:hover{background:#FBE7DE;}
  .gatebar .gsum{margin-left:auto;font-size:11.5px;color:var(--body);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:430px;}
  .gatebar .gsum .no{color:var(--orange);font-weight:700;}
  .gatebar .gsum .ok{color:var(--green);font-weight:700;}
  .ticker{margin-left:auto;font-size:11.5px;color:var(--body);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:470px;
    transition:opacity .45s;}
  .ticker.fade{opacity:0;}
  .ticker .deny{color:var(--orange);font-weight:700;}
  .ticker .q{font-family:var(--mono);font-size:11px;}

  /* ---- agent ---- */
  .agent{width:188px;cursor:pointer;}
  .agent .body{padding:9px 11px;display:flex;align-items:center;gap:10px;}
  .orb{width:26px;height:26px;border-radius:50%;flex:none;position:relative;
    background:radial-gradient(circle at 35% 35%,var(--orange-soft),var(--orange));
    animation:hum 2.2s ease-in-out infinite;}
  .orb::after{content:"";position:absolute;inset:-6px;border-radius:50%;
    border:2px solid var(--orange);opacity:.4;animation:ring 2.2s ease-out infinite;}
  @keyframes hum{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(200,73,31,.4)}
    50%{transform:scale(1.12);box-shadow:0 0 14px 3px rgba(200,73,31,.35)}}
  @keyframes ring{0%{transform:scale(.7);opacity:.5}100%{transform:scale(1.5);opacity:0}}
  .agent .meta{font-size:11px;line-height:1.4;}
  .agent .meta b{font-size:12px;}
  .agent .meta span{color:var(--muted);}
  .agent .rails{display:flex;gap:3px;padding:0 11px 9px;}
  .agent .rails i{width:5px;height:5px;border-radius:50%;background:var(--orange-soft);
    opacity:.8;font-style:normal;}

  /* ---- dashboards ---- */
  .dash{width:250px;cursor:pointer;}
  .dash .body{padding:10px 12px 12px;}
  .bars{display:flex;align-items:flex-end;gap:7px;height:74px;margin-top:4px;}
  .bars .bar{flex:1;background:linear-gradient(180deg,var(--orange-soft),var(--orange));
    border-radius:4px 4px 0 0;height:20%;animation:grow 3.4s ease-in-out infinite alternate;}
  @keyframes grow{from{height:22%}to{height:92%}}
  .pareto{display:flex;align-items:flex-end;gap:7px;height:74px;margin-top:4px;}
  .pareto .bar{flex:1;background:#B9B3A6;border-radius:4px 4px 0 0;
    animation:pgrow 3s ease-in-out infinite alternate;}
  .pareto .bar:nth-child(1){background:var(--orange);}
  @keyframes pgrow{from{transform:scaleY(.9);transform-origin:bottom}
    to{transform:scaleY(1);transform-origin:bottom}}
  .kpi{font-size:26px;font-weight:800;letter-spacing:-.5px;}
  .kpi small{font-size:12px;color:var(--muted);font-weight:600;}
  .spark{display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:6px;}
  .spark i{width:6px;background:var(--green);border-radius:2px;opacity:.85;
    animation:grow 2.6s ease-in-out infinite alternate;}

  /* add-analysis card */
  .addcard{width:250px;border:1.6px dashed var(--orange-soft);background:#FCF7F4;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;
    height:60px;color:var(--orange);font-weight:700;font-size:13.5px;
    transition:background .2s, transform .15s;}
  .addcard:hover{background:#FBEFE8;transform:translateY(-1px);}
  .addcard .plus{width:22px;height:22px;border-radius:50%;background:var(--orange);

/* ---------------- helpers ---------------- */
function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls;
  if(html!=null)e.innerHTML=html; return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function anchorL(n){return {x:n.offsetLeft, y:n.offsetTop+n.offsetHeight/2};}
function anchorT(n){return {x:n.offsetLeft+n.offsetWidth/2, y:n.offsetTop};}
function anchorB(n){return {x:n.offsetLeft+n.offsetWidth/2, y:n.offsetTop+n.offsetHeight};}

function pathD(a,b){
  const dx=b.x-a.x, dy=b.y-a.y;
  if(Math.abs(dx)>=Math.abs(dy)){
    const h=Math.max(50, Math.abs(dx)*0.45);
    return `M${a.x},${a.y} C${a.x+h},${a.y} ${b.x-h},${b.y} ${b.x},${b.y}`;
  }else{
    const v=Math.max(50,Math.abs(dy)*0.45);
    return `M${a.x},${a.y} C${a.x},${a.y+v} ${b.x},${b.y-v} ${b.x},${b.y}`;
  }
}
function agentsReading(tableKey){
  return Object.keys(AGENTS).filter(k=>AGENTS[k].reads.includes(tableKey));
}

/* ---------------- canvas transform (magnify) ---------------- */
let tx=0, ty=0, scale=1;
const FOCUS_SCALE = 1.3;
function applyTransform(){
  canvas.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
}

/* ---------------- drag (canvas-style) ---------------- */
let dragSwallow=false;
function makeDraggable(node){
  node.style.cursor='grab';
  node.addEventListener('pointerdown',e=>{
    if(e.button!==0) return;
    // Let interactive controls keep their click. Pointer capture below retargets the
    // click to this node, so anything with its own handler must be excluded here.
    if(e.target.closest('.rolechip, .railchip, .conn')) return;
    const sx=e.clientX, sy=e.clientY, ox=node.offsetLeft, oy=node.offsetTop;
    let moved=false, raf=0;
    node.setPointerCapture(e.pointerId);
    node.style.zIndex=25;
    const mv=ev=>{
      const dx=(ev.clientX-sx)/scale, dy=(ev.clientY-sy)/scale;
      if(!moved && (Math.abs(dx)+Math.abs(dy))*scale<4) return;
      moved=true; node.style.cursor='grabbing';
      node.style.left=(ox+dx)+'px'; node.style.top=(oy+dy)+'px';
      if(!raf) raf=requestAnimationFrame(()=>{raf=0; drawWires(); sketch();});
    };
    const up=()=>{
      node.releasePointerCapture(e.pointerId);
      node.removeEventListener('pointermove',mv);
      node.removeEventListener('pointerup',up);
      node.style.cursor='grab'; node.style.zIndex='';
      if(moved){ dragSwallow=true; setTimeout(()=>dragSwallow=false,0); drawWires(); sketch(); }
    };
    node.addEventListener('pointermove',mv);
    node.addEventListener('pointerup',up);
  });
}

/* ---------------- build nodes ---------------- */
const nodeEls = {};

function buildConnectors(){
  const p = el('div','node connectors'); p.id='n_connectors';
  p.appendChild(el('div','title','⛓ Connectors'));
  CONNECTORS.forEach(c=>{
    const row = el('div','conn'+(c.on?' on':''));
    row.dataset.id=c.id;
    row.innerHTML = `<div class="sw"></div><div class="nm">${c.nm}</div><div class="src">${c.src}</div>`;
    row.querySelector('.sw').onclick = (e)=>{e.stopPropagation(); toggleConnector(c.id);};
    row.onclick = ()=>focusOn('connector', c.id, p);
    p.appendChild(row);
  });
  dom.appendChild(p); nodeEls['connectors']=p; makeDraggable(p);
}

function tableCard(key){
  const t = TABLES[key];
  const n = el('div','node tbl'); n.id='n_'+key; n.style.left=t.x+'px'; n.style.top=t.y+'px';
  n.innerHTML = `<div class="hd"><span class="mono">▦ ${t.title}</span>
    <span class="tag">${t.rows.length} rows</span></div>`;
  const g = el('div','grid');
  const cols = el('div','cols');
  t.cols.forEach(c=>cols.appendChild(el('span','chip',c)));
  g.appendChild(cols);
  const tb = el('table');
  t.rows.forEach(r=>{
    const tr=el('tr');
    r.forEach(cell=>{
      const td=el('td');
      if(Array.isArray(cell)){ td.className=cell[1]; td.textContent=cell[0]; }
      else td.textContent=cell;
      tr.appendChild(td); });
    tb.appendChild(tr);
  });
  g.appendChild(tb); n.appendChild(g);
  n.onclick=()=>focusOn('table', key, n);
  makeDraggable(n);
  return n;
}

/* ---------------- governance bar ---------------- */
function buildGovernance(){
  const n=el('div','node gatebar govbar'); n.id='n_gov';
  n.innerHTML=`<span class="num">3</span>
    <div class="glabel">🔒 Governance <small>data access</small></div>
    <div class="roles"></div>
    <div class="gsum"></div>
    <span class="tip">${STEP_TIPS[3]}</span>`;
  const roles=n.querySelector('.roles');
  Object.keys(ROLES).forEach(r=>{
    const c=el('div','rolechip'+(r===ROLE?' active':''),r);
    c.onclick=(e)=>{e.stopPropagation(); ROLE=r; refreshGovernance(); applyMasks();
      if(focus.kind==='governance'||focus.kind==='agent') renderInspector();};
    roles.appendChild(c);
  });
  n.onclick=()=>focusOn('governance',null,n);
  dom.appendChild(n); nodeEls['gov']=n; makeDraggable(n);
  refreshGovernance();
}
function refreshGovernance(){
  const g=nodeEls['gov'];
  g.querySelectorAll('.rolechip').forEach(c=>c.classList.toggle('active', c.textContent===ROLE));
  const masked = Object.entries(ROLES[ROLE]).filter(([k,v])=>v==='mask' && isTableVisible(k))
    .map(([k])=> TABLES[k].mask ? `${k}·${TABLES[k].mask}` : k);
  g.querySelector('.gsum').innerHTML = masked.length
    ? `<b>${ROLE}</b> → <span class="no">masked:</span> ${masked.join(', ')}`
    : `<b>${ROLE}</b> → <span class="ok">full access</span>`;
}
function applyMasks(){
  Object.keys(TABLES).forEach(key=>{
    const t=TABLES[key], n=nodeEls['tbl_'+key]; if(!n) return;
    const masked = ROLES[ROLE][key]==='mask';
    n.querySelectorAll('.grid tr').forEach(tr=>{
      [...tr.children].forEach((td,i)=>{
        const hit = masked && (t.mask ? t.cols[i]===t.mask : true);
        if(hit){ if(!td.dataset.real) td.dataset.real=td.textContent;
          td.textContent='••••'; td.style.filter='blur(.3px)'; td.style.color='var(--muted)';}
        else if(td.dataset.real){ td.textContent=td.dataset.real; delete td.dataset.real;
          td.style.filter=''; td.style.color='';}
      });
    });
  });
}

function renderTicker(){

function tickRails(){

  t.classList.add('fade');

}

/* ---------------- agents + dashboards ---------------- */
function agentCard(key){
  const a=AGENTS[key];
  const n=el('div','node agent'); n.id='n_ag_'+key; n.style.left=a.x+'px'; n.style.top=a.y+'px';
  n.innerHTML=`<div class="hd"><span class="mono">◐ agent</span><span class="tag">on-prem</span></div>
    <div class="body"><div class="orb"></div>
    <div class="meta"><b>${a.name}</b><br><span>humming…</span></div></div>
    <div class="rails">${'<i></i>'.repeat(RAILS.length)}</div>`;
  n.onclick=()=>focusOn('agent',key,n);
  makeDraggable(n);

function dashCard(d){
  const n=el('div','node dash'); n.id='n_'+d.id; n.style.left=d.x+'px'; n.style.top=d.y+'px';
  let inner='';
  if(d.kind==='oee') inner=`<div class="kpi">78<small>%</small></div>
    <div class="bars">${'<div class="bar"></div>'.repeat(6)}</div>`;
  else if(d.kind==='pareto') inner=`<div class="pareto">${
      [90,64,40,28,16].map((h,i)=>`<div class="bar" style="height:${h}%;animation-delay:${i*.2}s"></div>`).join('')}</div>`;
  else if(d.kind==='kpi') inner=`<div class="kpi">${(Math.floor(20+Math.abs(Math.sin(d.x))*80))}<small>/hr</small></div>
    <div class="spark">${[4,7,5,9,6,8,7].map((h,i)=>`<i style="height:${h*3}px;animation-delay:${i*.18}s"></i>`).join('')}</div>`;
  else inner=`<div class="spark">${[5,8,6,9,7,10,8,6].map((h,i)=>`<i style="height:${h*3}px;animation-delay:${i*.15}s"></i>`).join('')}</div>
    <div style="font-size:11px;color:var(--muted);margin-top:6px">live · updating</div>`;
  n.innerHTML=`<div class="hd"><span>📊 ${d.title}</span><span class="tag">${AGENTS[d.agent].name.split(' ')[0]}</span></div>
    <div class="body">${inner}</div>`;
  n.onclick=()=>focusOn('dash',d.id,n);
  makeDraggable(n);
  return n;
}

/* ---------------- table visibility (connector-driven) ---------------- */
function isTableVisible(key){
  const c = CONNECTORS.find(c=>c.table===key);
  return c ? c.on : true;
}
function renderTables(){
  Object.keys(TABLES).forEach(key=>{
    const want=isTableVisible(key);
    const have=!!nodeEls['tbl_'+key];
    if(want && !have){
      const n=tableCard(key); n.classList.add('enter'); dom.appendChild(n);
      nodeEls['tbl_'+key]=n; requestAnimationFrame(()=>requestAnimationFrame(()=>n.classList.remove('enter')));
    } else if(!want && have){
      const n=nodeEls['tbl_'+key]; n.classList.add('enter');
      setTimeout(()=>{n.remove();},480); delete nodeEls['tbl_'+key];
      if(focus.kind==='table' && focus.key===key) clearFocus();
    }
  });
}

/* ---------------- wires ---------------- */
function clearWires(){[...wires.querySelectorAll('.wire,.xlink')].forEach(w=>w.remove());
  [...dom.querySelectorAll('.pulse')].forEach(p=>p.remove());}

function addWire(a,b,cls,dur,delay){
  const d=pathD(a,b);
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d); p.setAttribute('class',cls||'wire'); wires.appendChild(p);
  if(cls==='xlink'){ animateXlink(p); return p; }
  const dot=el('div','pulse'); dot.style.offsetPath=`path('${d}')`;
  dot.style.animationDuration=(dur||3.2)+'s'; dot.style.animationDelay=(delay||0)+'s';
  dom.appendChild(dot);
  return p;
}
function animateXlink(p){
  const len=p.getTotalLength(); p.style.strokeDasharray=len; p.style.strokeDashoffset=len;
  p.style.transition='none';
  requestAnimationFrame(()=>{ p.style.transition='stroke-dashoffset 1.1s ease, opacity .6s';
    p.style.strokeDashoffset=0; p.style.opacity=.7; });
}

function drawWires(){
  clearWires();
  const conn = nodeEls['connectors'];
  const connRows = [...conn.querySelectorAll('.conn')];
  // connectors -> tables (into the data box)
  CONNECTORS.forEach((c,i)=>{
    if(!c.on) return; const t=nodeEls['tbl_'+c.table]; if(!t) return;
    const row=connRows[i];
    const a={x:conn.offsetLeft+conn.offsetWidth, y:conn.offsetTop+row.offsetTop+row.offsetHeight/2};
    addWire(a, anchorL(t), 'wire', 2.6, i*0.25);
  });
  const box=nodeEls['databox'], gv=nodeEls['gov'], rl=nodeEls['rails'];
  // data box -> governance gate (all data funnels through the access policy)
  [0.34,0.66].forEach((f,i)=>{
    const x=box.offsetLeft+box.offsetWidth*f;
    addWire({x, y:box.offsetTop+box.offsetHeight}, {x, y:gv.offsetTop}, 'wire', 2.4, 0.4+i*0.2);
  });
  // governance -> guard rails (governed data now passes the behaviour gate)
  [0.34,0.66].forEach((f,i)=>{
    const x=gv.offsetLeft+gv.offsetWidth*f;
    addWire({x, y:gv.offsetTop+gv.offsetHeight}, {x, y:rl.offsetTop}, 'wire', 2.0, 0.6+i*0.2);
  });
  // guard rails -> agents (only governed data, and only railed behaviour, reaches the agents)
  Object.keys(AGENTS).forEach((key,i)=>{
    const ag=nodeEls['ag_'+key]; if(!ag) return;
    const x=ag.offsetLeft+ag.offsetWidth/2;
    addWire({x, y:rl.offsetTop+rl.offsetHeight}, anchorT(ag), 'wire', 2.8, 0.9+i*0.22);
  });
  // agents -> dashboards
  DASH.forEach((d,i)=>{
    const ag=nodeEls['ag_'+d.agent]; const dn=nodeEls[d.id]; if(!ag||!dn) return;
    addWire(anchorB(ag), anchorL(dn), 'wire', 3.0, 1.0+i*0.22);
  });
  drawXlinks();
}
function drawXlinks(){
  const pairs=[['machines','downtime'],['downtime','orders']];
  pairs.forEach(([x,y])=>{
    const a=nodeEls['tbl_'+x], b=nodeEls['tbl_'+y]; if(!a||!b) return;
    addWire(anchorB(a), anchorT(b), 'xlink');
  });
}

/* ---------------- connector toggle ---------------- */
function toggleConnector(id){
  if(dragSwallow) return;
  const c=CONNECTORS.find(c=>c.id===id); c.on=!c.on;
  const row=[...nodeEls['connectors'].querySelectorAll('.conn')].find(r=>r.dataset.id===id);
  row.classList.toggle('on', c.on);
  renderTables();
  setTimeout(()=>{ drawWires(); applyMasks(); refreshGovernance(); sketch(); updateCounts();
    if(focus.kind) renderInspector(); }, c.on?60:200);
}

/* ---------------- add analysis ---------------- */
function addAnalysis(){
  if(dragSwallow) return;
  if(addPtr>=EXTRA_ANALYSES.length) return;
  const spec=EXTRA_ANALYSES[addPtr];
  const slot=ADD_SLOTS[addPtr];
  const d={id:'d_extra'+addPtr, x:slot.x, y:slot.y, kind:spec.kind, title:spec.title, agent:spec.agent};
  DASH.push(d);
  const n=dashCard(d); n.classList.add('enter'); dom.appendChild(n); nodeEls[d.id]=n;
  requestAnimationFrame(()=>requestAnimationFrame(()=>n.classList.remove('enter')));
  addPtr++;
  positionAddCard();
  setTimeout(()=>{ drawWires(); sketch(); updateCounts(); },120);
}

/* ---------------- focus + inspector ---------------- */
const inspector=document.getElementById('inspector');
const insTitle=document.getElementById('insTitle');
const insBadge=document.getElementById('insBadge');
const insBody=document.getElementById('insBody');
let focus={kind:null,key:null,node:null};
document.getElementById('insX').onclick=(e)=>{e.stopPropagation(); clearFocus();};

function focusOn(kind,key,node){
  if(dragSwallow) return;
  focus={kind,key,node};
  // highlight
  dom.querySelectorAll('.focused').forEach(n=>n.classList.remove('focused'));
  node.classList.add('focused');
  dom.classList.add('focusing');
  canvas.classList.add('focusing');
  // magnify: pan so the focused card sits centred in the space left of the panel
  const r=node.getBoundingClientRect();
  const cx=node.offsetLeft+node.offsetWidth/2, cy=node.offsetTop+node.offsetHeight/2;
  const baseX=(r.left+r.width/2)-tx-cx*scale;
  const baseY=(r.top+r.height/2)-ty-cy*scale;
  const panelW=inspector.offsetWidth||410;
  const px=Math.max(60,(window.innerWidth-panelW)/2);
  const py=52+(window.innerHeight-52)/2;
  // Magnify small cards; only frame wide ones (the gate bars span 1150px and would
  // otherwise overflow the space beside the panel and clip their own labels).
  const fit=(px*2-40)/node.offsetWidth;
  scale=Math.max(1, Math.min(FOCUS_SCALE, fit));
  tx=px-baseX-cx*scale;
  ty=py-baseY-cy*scale;
  applyTransform();
  document.body.style.overflow='hidden';
  renderInspector();
  inspector.classList.add('open');
}
function clearFocus(){
  if(!focus.kind) return;
  focus={kind:null,key:null,node:null};
  dom.querySelectorAll('.focused').forEach(n=>n.classList.remove('focused'));
  dom.classList.remove('focusing');
  canvas.classList.remove('focusing');
  tx=0; ty=0; scale=1; applyTransform();
  document.body.style.overflow='';
  inspector.classList.remove('open');
}
document.addEventListener('click',(e)=>{
  if(inspector.contains(e.target)) return;
  if(e.target.closest('.node, .dbhd, .step')) return;
  clearFocus();
});
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape') clearFocus(); });

function setIns(title,badge,html){
  insTitle.textContent=title; insBadge.textContent=badge; insBody.innerHTML=html;
  insBody.scrollTop=0;
}

function renderInspector(){
  const {kind,key}=focus;
  if(kind==='table') return insTable(key);
  if(kind==='connector') return insConnector(key);
  if(kind==='datalayer') return insDataLayer();
  if(kind==='governance') return insGovernance();
  if(kind==='guardrails') return insGuardRails(key);
  if(kind==='agent') return insAgent(key);
  if(kind==='dash') return insDash(key);
}

function insTable(key){
  const t=TABLES[key];
  const conn=CONNECTORS.find(c=>c.table===key);
  const roleState=ROLES[ROLE][key];
  const all=[...t.cols, ...(t.breath||[])];
  const colsHtml=all.map(c=>{
    const m=(t.colMeta||{})[c]||{};
    const pills=[];
    if(m.key) pills.push('<span class="pill key">key</span>');
    if(t.mask===c) pills.push('<span class="pill mask">maskable</span>');
    if(m.arriving) pills.push('<span class="pill new">arriving</span>');
    const joins=(m.joins||[]).length
      ? `<div class="joins"><span>joins → </span>${m.joins.map(esc).join('<span> · </span>')}</div>` : '';
    return `<div class="colrow">
      <div class="colhd"><span class="colnm">${esc(c)}</span>${pills.join('')}</div>
      <div class="colmean">${esc(m.mean||'')}</div>${joins}</div>`;
  }).join('');
  const readers=agentsReading(key).map(k=>AGENTS[k].name);
  const roleRows=Object.keys(ROLES).map(r=>{
    const v=ROLES[r][key];
    const label = v==='ok' ? '<span class="ok">full</span>'
      : (t.mask ? `<span class="no">${esc(t.mask)} masked</span>` : '<span class="no">all masked</span>');
    return `<div class="kv"><div class="k">${r}${r===ROLE?' ●':''}</div><div class="v">${label}</div></div>`;
  }).join('');
  setIns('▦ '+t.title,'table',`
    <div class="lede">${esc(t.desc)}</div>
    <div class="meta-line">via <b>${esc(conn?conn.nm:'—')}</b> (${esc(t.proto)}) · ${esc(t.cadence)} · ${t.rows.length} rows shown</div>
    <div class="sec"><h4>Columns</h4>${colsHtml}</div>
    <div class="sec"><h4>Unified context</h4><div class="callout">${esc(t.unified)}</div></div>
    <div class="sec"><h4>Read by</h4>
      ${readers.length?`<div class="chiplist">${readers.map(n=>`<span>◐ ${esc(n)}</span>`).join('')}</div>`
        :'<div style="color:var(--muted)">No agent reads this table yet.</div>'}</div>
    <div class="sec"><h4>Access by role</h4>${roleRows}
      <div class="meta-line">Current role <b>${ROLE}</b> → ${roleState==='ok'?'<span class="ok">full access</span>':'<span class="no">masked</span>'}</div></div>`);
}

  setIns(c.nm,'connector',`
    <div class="lede">${esc(c.desc)}</div>
    <div class="meta-line">${c.on?'<b style="color:var(--green)">● connected</b>':'<b style="color:var(--muted)">○ not connected</b>'} · ${esc(c.src)}</div>
    <div class="sec"><h4>Lands as</h4>

function insDataLayer(){
  const vis=Object.keys(TABLES).filter(isTableVisible);
  const colCount=vis.reduce((a,k)=>a+TABLES[k].cols.length+(TABLES[k].breath||[]).length,0);
  const rows=vis.map(k=>`<div class="kv"><div class="k mono">${esc(TABLES[k].title)}</div>
    <div class="v">${esc(TABLES[k].desc)}</div></div>`).join('');
  setIns('Data Layer','layer',`
    <div class="lede">Every connected source lands here as clean, linked tables, with one resolved identity per real-world thing.</div>
    <div class="meta-line"><b>${vis.length}</b> tables · <b>${colCount}</b> columns · sources stay untouched</div>
    <div class="sec"><h4>What unification actually means</h4>
      <div class="callout">The layer does not copy five systems into one schema and hope. It resolves entities. One machine, one order, one shift exists once, no matter how many systems spell it differently. That is what makes a question like "why did this order slip?" answerable in a single hop across SCADA, MES, SAP, a spreadsheet and a chat group.</div></div>
    <div class="sec"><h4>Tables in the layer</h4>${rows}</div>
    <div class="sec"><h4>Cross-links</h4>
      <div class="joins">machines.Machine <span>↔</span> downtime.Machine</div>
      <div class="joins">machines.Machine <span>↔</span> quality_checks.Part</div>
      <div class="joins">machines.Line <span>↔</span> orders.Line</div>
      <div class="meta-line">Drawn continuously as new data arrives, not defined up front in a data model.</div></div>`);
}

function insGovernance(){
  const vis=Object.keys(TABLES).filter(isTableVisible);
  const rows=Object.keys(ROLES).map(r=>{
    const cells=vis.map(k=>{
      const v=ROLES[r][k];
      return `<span style="font-family:var(--mono);font-size:10.5px">${esc(k)}</span> ${v==='ok'?'<span class="ok">✓</span>':'<span class="no">masked</span>'}`;
    }).join(' &nbsp; ');
    return `<div style="margin-bottom:10px"><b>${r}${r===ROLE?' ●':''}</b><br>
      <span style="font-size:11.5px">${cells}</span></div>`;
  }).join('');
  setIns('🔒 Governance','data access',`
    <div class="lede">One access policy guards the whole data layer. It decides who may see what, and masks the fields they may not, before anything downstream reads a byte.</div>
    <div class="meta-line">Active role <b>${ROLE}</b> · switch roles on the bar to watch masking apply live</div>
    <div class="sec"><h4>Role × table policy</h4>${rows}</div>
    <div class="sec"><h4>Where it applies</h4>
      <div class="callout">Masking happens between the data layer and the agents, not in the dashboard. An agent that is not entitled to a column never receives it, so it cannot leak it, summarise it, or infer around it.</div></div>
    <div class="sec"><h4>This is only half the gate</h4>
      <div class="meta-line">Governance controls <b>what goes in</b>. The <b>Guard Rails</b> layer below controls <b>what comes out</b>: what the agent may do, must cite, and when it must escalate.</div></div>`);
}

function insGuardRails(highlight){
  const rows=RAILS.map(r=>`
    <div class="rail${highlight===r.id?' hl':''}">
      <div class="rn">${esc(r.nm)}</div>
      <div class="rd">${esc(r.desc)}</div>
      <div class="ex"><span class="y">✓</span><span>“${esc(r.allow)}”</span></div>
      <div class="ex"><span class="n">⊘</span><span>“${esc(r.block)}”</span></div>
    </div>`).join('');
  setIns('🛡 Guard Rails','agent behaviour',`
    <div class="lede">Governance gates the data going in. Guard rails gate the behaviour coming out: what an agent may do, what it must cite, and when it must hand back to a human.</div>
    <div class="meta-line"><b>${RAILS.length}</b> rails · applied to every agent · evaluated on every response</div>
    <div class="sec"><h4>The rails</h4>${rows}</div>
    <div class="sec"><h4>Why this is separate from access control</h4>
      <div class="callout">An agent can be perfectly entitled to the data and still do the wrong thing with it: write to a setpoint, answer a safety question it should escalate, or state a number it cannot source. Access control cannot catch any of those, because nothing was read that should not have been. Rails are the layer that can.</div></div>`);
}

  const a=AGENTS[key];
  const reads=a.reads.filter(isTableVisible);
  const blocked=a.reads.filter(k=>isTableVisible(k) && ROLES[ROLE][k]==='mask');
  setIns('◐ '+a.name,'agent',`
    <div class="lede">${esc(a.job)}</div>
    <div class="meta-line"><span style="color:var(--green);font-weight:700">● humming</span> · runs on-prem · no data leaves the plant</div>
    <div class="sec"><h4>Reads</h4>
      <div class="chiplist">${reads.map(k=>`<span>▦ ${esc(k)}</span>`).join('')}</div>
      ${blocked.length?`<div class="meta-line">Masked for <b>${ROLE}</b>: ${blocked.map(esc).join(', ')} — the agent receives these columns already redacted.</div>`:''}</div>
    <div class="sec"><h4>Writes</h4>
      <div class="kv"><div class="k">Output</div><div class="v">${esc(a.writes)}</div></div>
      <div class="kv"><div class="k">Control systems</div><div class="v"><span class="no">never</span></div></div></div>
    <div class="sec"><h4>Bound by</h4>
      ${RAILS.map(r=>`<div class="kv"><div class="k">${esc(r.nm)}</div><div class="v">${esc(r.desc.split('.')[0])}.</div></div>`).join('')}</div>
    <div class="sec"><h4>Under the current role</h4>
      <div class="callout">Acting for <b>${ROLE}</b>. It sees exactly what that role may see, and it answers only within the ${RAILS.length} rails above. Change the role on the governance bar and this agent's view narrows or widens with it.</div></div>`);
}

function insDash(id){

    <div class="sec"><h4>Built by</h4>
      <div class="kv"><div class="k">Agent</div><div class="v">◐ ${esc(a.name)}</div></div>
      <div class="kv"><div class="k">Fed by</div><div class="v">${feeds.map(k=>`<span class="mono">${esc(k)}</span>`).join(', ')}</div></div></div>
    <div class="sec"><h4>How it got here</h4>

/* ---------------- sketch accents (rough.js) ---------------- */
let sketchG=null;
function sketch(){
  if(sketchG) sketchG.remove();
  sketchG=document.createElementNS('http://www.w3.org/2000/svg','g');
  sketchG.setAttribute('class','sketch'); wires.appendChild(sketchG);
  Object.keys(AGENTS).forEach(key=>{
    const n=nodeEls['ag_'+key]; if(!n) return;
    const c=rc.ellipse(n.offsetLeft+n.offsetWidth/2, n.offsetTop+n.offsetHeight/2,
      n.offsetWidth+22, n.offsetHeight+18, {stroke:'#E8825C',strokeWidth:1.4,roughness:2.4});
    c.setAttribute('opacity','.5'); sketchG.appendChild(c);
  });
}

/* ---------------- column breathe loop ---------------- */
function breatheLoop(){
  Object.keys(TABLES).forEach(key=>{
    const n=nodeEls['tbl_'+key]; if(!n) return;
    const t=TABLES[key]; if(!(t.breath&&t.breath.length)) return;
    const cols=n.querySelector('.cols');
    const chip=el('span','chip newcol ghost', t.breath[Math.floor(Date.now()/4300)%t.breath.length]);
    cols.appendChild(chip);
    requestAnimationFrame(()=>requestAnimationFrame(()=>chip.classList.remove('ghost')));
    setTimeout(()=>{chip.classList.add('ghost'); setTimeout(()=>chip.remove(),600);}, 2600);
  });
}

/* ---------------- counts ---------------- */
function updateCounts(){
  document.getElementById('cCount').textContent=CONNECTORS.filter(c=>c.on).length;
  document.getElementById('tCount').textContent=Object.keys(TABLES).filter(isTableVisible).length;
  document.getElementById('rCount').textContent=RAILS.length;
  document.getElementById('aCount').textContent=Object.keys(AGENTS).length;
  document.getElementById('dCount').textContent=DASH.length;
}

/* ---------------- init ---------------- */
function init(){
  buildDataBox();
  buildConnectors();
  renderTables();
  buildGovernance();
  buildRails();
  Object.keys(AGENTS).forEach(key=>{const n=agentCard(key); dom.appendChild(n); nodeEls['ag_'+key]=n;});
  DASH.forEach(d=>{const n=dashCard(d); dom.appendChild(n); nodeEls[d.id]=n;});
  buildAddCard();
  buildSteps();
  requestAnimationFrame(()=>{ drawWires(); sketch(); applyMasks(); updateCounts();
    setInterval(breatheLoop, 4300); breatheLoop();
    setInterval(drawXlinks, 6000);
